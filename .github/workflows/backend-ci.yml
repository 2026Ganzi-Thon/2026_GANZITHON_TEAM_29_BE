name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Supabase backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase
        timeout-minutes: 15
        run: >-
          npx supabase start
          --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > /dev/null

      - name: Reset local database
        run: npm run db:reset

      - name: Run pgTAP tests
        run: npm run db:test

      - name: Run Auth and RPC integration tests
        run: npm run test:integration

      - name: Lint database schema
        run: npm run db:lint

      - name: Audit npm dependencies
        run: npm audit

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
